    const LOCAL_KEY = "phd-workspace-web-additions-v1";
    const GITHUB_TOKEN_KEY = "phd-workspace-github-token-v1";
    const VAULT_REPO = { owner: "cuglibo", repo: "obsidian-workstation-vault", branch: "main" };
    const SITE_REPO = { owner: "cuglibo", repo: "daily-essays-site", branch: "main" };
    const WEB_INBOX_DIR = "PhD Master Workspace/Web Inbox";
    let appPayload = null;
    let activeSectionId = "essays";
    let currentPassword = "";

    const decoder = new TextDecoder();
    const encoder = new TextEncoder();

    function fromBase64(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function compact(value, max = 120) {
      const text = String(value ?? "").replace(/\s+/g, " ").trim();
      return text.length > max ? text.slice(0, max) + "..." : text;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return btoa(binary);
    }

    function toBase64Utf8(value) {
      return bytesToBase64(encoder.encode(value));
    }

    function randomBytes(length) {
      const bytes = new Uint8Array(length);
      crypto.getRandomValues(bytes);
      return bytes;
    }

    function markdownToHtmlClient(markdown) {
      const text = String(markdown || "").trim();
      if (!text) return "";
      return "<p>" + escapeHtml(text).replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
    }

    function slugifyPathPart(value) {
      return String(value || "web-note")
        .normalize("NFKC")
        .replace(/[<>:"\\|?*]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .slice(0, 60) || "web-note";
    }

    function frontmatterValue(value) {
      return String(value ?? "").replaceAll('"', '\"').replace(/\r?\n/g, " ");
    }

    function createWebItem(sectionId, title, body) {
      const now = new Date();
      const stamp = now.toISOString().replace(/[-:.TZ]/g, "").slice(0, 14);
      const itemTitle = title.trim() || "网页新增内容";
      return {
        id: "web-" + stamp + "-" + Math.random().toString(36).slice(2, 8),
        type: sectionId,
        title: itemTitle,
        date: now.toISOString().slice(0, 10),
        body,
        html: markdownToHtmlClient(body),
        meta: { target: sectionId, source: "web" },
        createdAt: now.toISOString(),
      };
    }

    function createMarkdownNote(item) {
      return [
        "---",
        'title: "' + frontmatterValue(item.title) + '"',
        'date: "' + frontmatterValue(item.date) + '"',
        'createdAt: "' + frontmatterValue(item.createdAt) + '"',
        'target: "' + frontmatterValue(item.meta?.target || item.type) + '"',
        'source: "web"',
        'id: "' + frontmatterValue(item.id) + '"',
        "---",
        "",
        item.body || "",
        "",
      ].join("\n");
    }

    function webInboxPath(item) {
      return WEB_INBOX_DIR + "/" + item.date + "-" + slugifyPathPart(item.title) + "-" + item.id + ".md";
    }

    async function encryptPayloadData(payload, password) {
      const salt = randomBytes(16);
      const iv = randomBytes(12);
      const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({
        name: "PBKDF2",
        salt,
        iterations: encryptedPayload.iterations || 250000,
        hash: "SHA-256",
      }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
      const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, tagLength: 128 }, key, encoder.encode(JSON.stringify(payload))));
      const tag = encrypted.slice(encrypted.length - 16);
      const data = encrypted.slice(0, encrypted.length - 16);
      return {
        v: 1,
        kdf: "PBKDF2-SHA256",
        iterations: encryptedPayload.iterations || 250000,
        cipher: "AES-256-GCM",
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        tag: bytesToBase64(tag),
        data: bytesToBase64(data),
      };
    }

    function contentApiPath(repo, filePath, query = "") {
      const encodedPath = filePath.split("/").map(encodeURIComponent).join("/");
      return "/repos/" + repo.owner + "/" + repo.repo + "/contents/" + encodedPath + query;
    }

    async function githubRequest(path, { method = "GET", token, body } = {}) {
      const response = await fetch("https://api.github.com" + path, {
        method,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": "Bearer " + token,
          "X-GitHub-Api-Version": "2022-11-28",
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        const error = new Error(data?.message || ("GitHub HTTP " + response.status));
        error.status = response.status;
        error.apiPath = path;
        throw error;
      }
      return data;
    }

    function repoName(repo) {
      return repo.owner + "/" + repo.repo;
    }

    function explainRepoAccessError(repo, error) {
      if (error.status === 401) {
        return "GitHub token 无效或已过期。请重新生成 token。";
      }
      if (error.status === 404) {
        return "Token 无法访问 " + repoName(repo) + "。请确认 fine-grained token 的 Repository access 包含这个仓库，并且 Permissions -> Contents 是 Read and write。";
      }
      if (error.status === 403) {
        return "Token 没有写入 " + repoName(repo) + " 的权限。请把 Permissions -> Contents 调整为 Read and write。";
      }
      return "检查 " + repoName(repo) + " 权限失败：" + (error.message || "未知错误");
    }

    async function ensureRepoAccess(repo, token) {
      try {
        await githubRequest("/repos/" + repo.owner + "/" + repo.repo, { token });
      } catch (error) {
        throw new Error(explainRepoAccessError(repo, error));
      }
    }

    async function getGithubFileSha(repo, filePath, token) {
      try {
        const data = await githubRequest(contentApiPath(repo, filePath, "?ref=" + encodeURIComponent(repo.branch)), { token });
        return data.sha || null;
      } catch (error) {
        if (error.status === 404) return null;
        throw error;
      }
    }

    async function putGithubFile(repo, filePath, content, message, token) {
      const sha = await getGithubFileSha(repo, filePath, token);
      const body = {
        message,
        content: toBase64Utf8(content),
        branch: repo.branch,
      };
      if (sha) body.sha = sha;
      return githubRequest(contentApiPath(repo, filePath), { method: "PUT", token, body });
    }

    function setSyncStatus(message, isError = false) {
      const node = document.getElementById("sync-status");
      if (!node) return;
      node.textContent = message;
      node.classList.toggle("error", isError);
    }

    function loadGithubToken() {
      return localStorage.getItem(GITHUB_TOKEN_KEY) || "";
    }

    function getGithubToken() {
      const input = document.getElementById("github-token");
      return (input?.value || loadGithubToken()).trim();
    }

    function getOrCreateWebSection() {
      let section = appPayload.sections.find((item) => item.id === "web-additions");
      if (!section) {
        section = {
          id: "web-additions",
          label: "网页新增",
          description: "从网页端提交并保存在私有 vault 的内容。",
          addable: false,
          items: [],
          count: 0,
        };
        appPayload.sections.push(section);
      }
      return section;
    }

    function addSyncedItemToPayload(item) {
      const section = getOrCreateWebSection();
      if (!section.items.some((existing) => existing.id === item.id)) {
        section.items.unshift(item);
      }
      section.count = section.items.length;
      appPayload.generatedAt = new Date().toISOString();
    }

    async function fetchFreshSiteHtml() {
      const response = await fetch("./index.html?cache=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("Cannot fetch current site HTML");
      return response.text();
    }

    function replaceEncryptedPayload(sourceHtml, payload) {
      const replacement = "let encryptedPayload = " + JSON.stringify(payload) + ";";
      const updated = sourceHtml.replace(/(?:let|const) encryptedPayload = \{[\s\S]*?\};/, replacement);
      if (updated === sourceHtml) throw new Error("Cannot replace encrypted payload");
      return updated;
    }

    async function syncItemToGithub(item, token) {
      setSyncStatus("正在检查 GitHub 权限...");
      await ensureRepoAccess(VAULT_REPO, token);
      await ensureRepoAccess(SITE_REPO, token);
      setSyncStatus("正在保存到私有 vault...");
      await putGithubFile(VAULT_REPO, webInboxPath(item), createMarkdownNote(item), "Add web note: " + item.title, token);
      addSyncedItemToPayload(item);
      setSyncStatus("正在重新加密并发布网页...");
      const nextEncryptedPayload = await encryptPayloadData(appPayload, currentPassword);
      const sourceHtml = await fetchFreshSiteHtml();
      const updatedHtml = replaceEncryptedPayload(sourceHtml, nextEncryptedPayload);
      await putGithubFile(SITE_REPO, "index.html", updatedHtml, "Publish web note: " + item.title, token);
      encryptedPayload = nextEncryptedPayload;
      renderDashboard();
      renderTabs();
      renderSection("web-additions");
      setSyncStatus("已同步到 GitHub，并更新加密网页。");
    }

    async function decryptPayload(password) {
      const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({
        name: "PBKDF2",
        salt: fromBase64(encryptedPayload.salt),
        iterations: encryptedPayload.iterations,
        hash: "SHA-256",
      }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const cipherWithTag = new Uint8Array([...fromBase64(encryptedPayload.data), ...fromBase64(encryptedPayload.tag)]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(encryptedPayload.iv), tagLength: 128 }, key, cipherWithTag);
      return JSON.parse(decoder.decode(plain));
    }

    function loadAdditions() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveAdditions(items) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(items));
    }

    function additionsSection(items = loadAdditions()) {
      return {
        id: "web-additions",
        label: "网页新增",
        description: "只保存在当前浏览器里的新增内容，可复制导出后同步回 Obsidian。",
        count: items.length,
        items,
      };
    }

    function allSections() {
      const localAdditions = loadAdditions();
      const sections = appPayload.sections.map((section) => ({
        ...section,
        items: [...(section.items || [])],
        count: (section.items || []).length,
      }));
      const webSection = sections.find((section) => section.id === "web-additions");
      if (localAdditions.length && webSection) {
        webSection.items = [...localAdditions, ...webSection.items];
        webSection.count = webSection.items.length;
      } else if (localAdditions.length) {
        sections.push(additionsSection(localAdditions));
      }
      return sections;
    }

    function renderDashboard() {
      const sections = allSections();
      document.getElementById("dashboard").innerHTML = sections.map((section) => `
        <button class="metric" type="button" data-section="${section.id}">
          <strong>${section.count}</strong>
          <span>${escapeHtml(section.label)}</span>
        </button>
      `).join("");
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = allSections().map((section) => `
        <button class="tab ${section.id === activeSectionId ? "active" : ""}" type="button" data-section="${section.id}">
          ${escapeHtml(section.label)}
        </button>
      `).join("");
    }

    function renderSection(sectionId = activeSectionId) {
      activeSectionId = sectionId;
      const section = allSections().find((item) => item.id === sectionId) || allSections()[0];
      const container = document.getElementById("section-view");
      document.getElementById("article").hidden = true;

      container.innerHTML = `
        <section class="section-head">
          <div>
            <p class="eyebrow">${section.count} items</p>
            <h2>${escapeHtml(section.label)}</h2>
            <p>${escapeHtml(section.description || "")}</p>
          </div>
        </section>
        <section class="item-list">
          ${section.items.length ? section.items.map((item, index) => `
            <button class="item-row" type="button" data-section="${section.id}" data-index="${index}">
              <time>${escapeHtml(item.date || "")}</time>
              <strong>${escapeHtml(item.title || "未命名内容")}</strong>
              <span>${escapeHtml(compact(item.body || item.meta?.summary || ""))}</span>
            </button>
          `).join("") : '<div class="empty">暂无内容</div>'}
        </section>
      `;

      renderTabs();
    }

    function renderArticle(sectionId, index) {
      const section = allSections().find((item) => item.id === sectionId);
      const item = section?.items?.[Number(index)];
      if (!item) return;
      const article = document.getElementById("article");
      const meta = Object.entries(item.meta || {}).filter(([, value]) => value).map(([key, value]) =>
        `<span>${escapeHtml(key)}: ${escapeHtml(value)}</span>`
      ).join("");
      article.hidden = false;
      article.innerHTML = `
        <time>${escapeHtml(item.date || "")}</time>
        <h1>${escapeHtml(item.title || "未命名内容")}</h1>
        <div class="meta-line">${meta}</div>
        <div class="prose">${item.html || ""}</div>
      `;
      article.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderNewContent() {
      const options = appPayload.sections.filter((section) => section.addable !== false).map((section) =>
        `<option value="${section.id}">${escapeHtml(section.label)}</option>`
      ).join("");
      document.getElementById("new-content").innerHTML = `
        <section class="editor-panel">
          <div>
            <p class="eyebrow">Add</p>
            <h2>新增内容</h2>
            <p>可先保存在本机浏览器，也可用 GitHub token 写入私有 vault 并更新加密网页。</p>
          </div>
          <form id="add-form" class="add-form">
            <select id="add-section">${options}</select>
            <input id="add-title" placeholder="标题">
            <textarea id="add-body" placeholder="正文"></textarea>
            <div class="token-row">
              <input id="github-token" type="password" autocomplete="off" placeholder="GitHub token">
              <button type="button" id="save-token" class="secondary">记住</button>
              <button type="button" id="forget-token" class="secondary danger">忘记</button>
            </div>
            <div class="form-actions">
              <button type="submit">本地保存</button>
              <button type="button" id="sync-to-github">同步到 GitHub</button>
              <button type="button" id="copy-additions" class="secondary">复制本地草稿</button>
              <button type="button" id="clear-additions" class="secondary danger">清空本地草稿</button>
            </div>
            <p id="sync-status" class="sync-status"></p>
          </form>
        </section>
      `;
      document.getElementById("github-token").value = loadGithubToken();
    }

    function readFormItem() {
      const sectionId = document.getElementById("add-section").value;
      const title = document.getElementById("add-title").value.trim();
      const body = document.getElementById("add-body").value.trim();
      if (!body && !title) return null;
      return createWebItem(sectionId, title, body);
    }

    function clearNewContentForm() {
      document.getElementById("add-title").value = "";
      document.getElementById("add-body").value = "";
    }

    function wireEvents() {
      document.getElementById("dashboard").addEventListener("click", (event) => {
        const button = event.target.closest("[data-section]");
        if (button) renderSection(button.dataset.section);
      });
      document.getElementById("tabs").addEventListener("click", (event) => {
        const button = event.target.closest("[data-section]");
        if (button) renderSection(button.dataset.section);
      });
      document.getElementById("section-view").addEventListener("click", (event) => {
        const row = event.target.closest("[data-index]");
        if (row) renderArticle(row.dataset.section, row.dataset.index);
      });
      document.getElementById("add-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const item = readFormItem();
        if (!item) return;
        const additions = loadAdditions();
        additions.unshift(item);
        saveAdditions(additions);
        clearNewContentForm();
        activeSectionId = "web-additions";
        renderDashboard();
        renderTabs();
        renderSection("web-additions");
        setSyncStatus("已保存在当前浏览器。");
      });
      document.getElementById("sync-to-github").addEventListener("click", async () => {
        const item = readFormItem();
        if (!item) {
          setSyncStatus("请先填写标题或正文。", true);
          return;
        }
        const token = getGithubToken();
        if (!token) {
          setSyncStatus("请先填写 GitHub token。", true);
          return;
        }
        try {
          await syncItemToGithub(item, token);
          clearNewContentForm();
          activeSectionId = "web-additions";
        } catch (error) {
          setSyncStatus(error.message || "同步失败。", true);
        }
      });
      document.getElementById("save-token").addEventListener("click", () => {
        const token = document.getElementById("github-token").value.trim();
        if (!token) {
          setSyncStatus("没有可保存的 token。", true);
          return;
        }
        localStorage.setItem(GITHUB_TOKEN_KEY, token);
        setSyncStatus("Token 已保存在当前浏览器。");
      });
      document.getElementById("forget-token").addEventListener("click", () => {
        localStorage.removeItem(GITHUB_TOKEN_KEY);
        document.getElementById("github-token").value = "";
        setSyncStatus("Token 已从当前浏览器移除。");
      });
      document.getElementById("copy-additions").addEventListener("click", async () => {
        await navigator.clipboard.writeText(JSON.stringify(loadAdditions(), null, 2));
      });
      document.getElementById("clear-additions").addEventListener("click", () => {
        if (!confirm("清空当前浏览器里的新增内容？")) return;
        saveAdditions([]);
        renderDashboard();
        renderTabs();
        renderSection(appPayload.sections[0]?.id || "essays");
      });
    }

    function render(payload) {
      appPayload = payload;
      document.getElementById("unlock").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("status").textContent = "已解锁";
      const total = payload.sections.reduce((sum, section) => sum + section.count, 0);
      document.getElementById("count").textContent = `${payload.sections.length} 个分区，${total} 条内容`;
      renderDashboard();
      renderTabs();
      renderSection(payload.sections[0]?.id || "essays");
      renderNewContent();
      wireEvents();
    }

    document.getElementById("unlock-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      document.getElementById("error").hidden = true;
      try {
        const password = document.getElementById("password").value;
        currentPassword = password;
        render(await decryptPayload(password));
      } catch (error) {
        document.getElementById("error").hidden = false;
      }
    });
  </script>
</body>
</html>
