    const decoder = new TextDecoder();
    const encoder = new TextEncoder();

    function fromBase64(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function decryptPayload(password) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromBase64(encryptedPayload.salt),
          iterations: encryptedPayload.iterations,
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const cipherWithTag = new Uint8Array([
        ...fromBase64(encryptedPayload.data),
        ...fromBase64(encryptedPayload.tag),
      ]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(encryptedPayload.iv), tagLength: 128 },
        key,
        cipherWithTag,
      );
      return JSON.parse(decoder.decode(plain));
    }

    function render(payload) {
      document.getElementById("unlock").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("status").textContent = "已解锁";
      document.getElementById("count").textContent = `${payload.essays.length} 篇文章`;

      const list = document.getElementById("essay-list");
      const article = document.getElementById("article");
      list.innerHTML = payload.essays.map((essay, index) => `
        <button class="essay-row" type="button" data-index="${index}">
          <time>${escapeHtml(essay.date)}</time>
          <strong>${escapeHtml(essay.title)}</strong>
          <span>${escapeHtml(essay.body.replace(/\s+/g, " ").slice(0, 110))}</span>
        </button>
      `).join("");

      list.addEventListener("click", (event) => {
        const row = event.target.closest("[data-index]");
        if (!row) return;
        const essay = payload.essays[Number(row.dataset.index)];
        article.hidden = false;
        article.innerHTML = `
          <time>${escapeHtml(essay.date)}</time>
          <h1>${escapeHtml(essay.title)}</h1>
          <div class="prose">${essay.html}</div>
        `;
        article.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    document.getElementById("unlock-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      document.getElementById("error").hidden = true;
      try {
        render(await decryptPayload(password));
      } catch (error) {
        document.getElementById("error").hidden = false;
      }
    });
  </script>
